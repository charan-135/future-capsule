<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Login — Future Capsule</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background: #090909;

            color: #f4f1eb;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            overflow: hidden;

        }


        /* =========================
           BACKGROUND
        ========================= */

        .background {

            position: fixed;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

        }


        .glow {

            position: absolute;

            width: 450px;

            height: 450px;

            border-radius: 50%;

            background:
                    radial-gradient(
                            circle,
                            rgba(255, 107, 69, 0.08),
                            transparent 70%
                    );

            top: -180px;

            right: -120px;

        }


        .grid {

            position: absolute;

            inset: 0;

            opacity: 0.08;

            background-image:
                    linear-gradient(
                            #fff 1px,
                            transparent 1px
                    ),
                    linear-gradient(
                            90deg,
                            #fff 1px,
                            transparent 1px
                    );

            background-size: 70px 70px;

            mask-image:
                    linear-gradient(
                            to bottom,
                            black,
                            transparent 80%
                    );

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            position: relative;

            z-index: 1;

            width: 100%;

            max-width: 430px;

        }


        /* =========================
           BRAND
        ========================= */

        .brand {

            text-align: center;

            margin-bottom: 45px;

        }


        .brand-name {

            color: #fff;

            font-size: 18px;

            font-weight: 600;

            letter-spacing: -0.03em;

        }


        .brand-tagline {

            margin-top: 9px;

            color: #555;

            font-family: monospace;

            font-size: 8px;

            letter-spacing: 0.2em;

            text-transform: uppercase;

        }


        /* =========================
           CARD
        ========================= */

        .card {

            padding: 42px;

            background:
                    rgba(15, 15, 15, 0.94);

            border:
                    1px solid #292929;

            box-shadow:
                    0 30px 80px
                    rgba(0, 0, 0, 0.5);

        }


        .eyebrow {

            color: #777;

            font-family: monospace;

            font-size: 8px;

            letter-spacing: 0.2em;

            text-transform: uppercase;

            margin-bottom: 17px;

        }


        h1 {

            font-family:
                    Georgia,
                    "Times New Roman",
                    serif;

            font-size: 48px;

            font-weight: 400;

            line-height: 0.95;

            letter-spacing: -0.06em;

        }


        h1 em {

            color: #ff6b45;

            font-style: italic;

        }


        .intro {

            margin-top: 17px;

            color: #666;

            font-size: 12px;

            line-height: 1.7;

        }


        /* =========================
           MESSAGE
        ========================= */

        .message {

            margin-top: 25px;

            padding: 13px 15px;

            border: 1px solid #4a2720;

            background: rgba(255, 107, 69, 0.05);

            color: #d28b78;

            font-size: 11px;

            line-height: 1.5;

            display: none;

        }


        .message.show {

            display: block;

        }


        .message.success {

            border-color: #28402f;

            background: rgba(100, 190, 120, 0.05);

            color: #8bb996;

        }


        /* =========================
           FORM
        ========================= */

        form {

            margin-top: 35px;

        }


        .field {

            margin-bottom: 25px;

        }


        label {

            display: block;

            margin-bottom: 10px;

            color: #777;

            font-family: monospace;

            font-size: 8px;

            letter-spacing: 0.18em;

            text-transform: uppercase;

        }


        .input-wrapper {

            position: relative;

        }


        input {

            width: 100%;

            height: 52px;

            padding: 0 15px;

            border: 1px solid #292929;

            outline: none;

            background: #0a0a0a;

            color: #eee;

            font-size: 13px;

            transition:
                    border-color 0.2s ease,
                    background 0.2s ease;

        }


        input:focus {

            border-color: #ff6b45;

            background: #0d0d0d;

        }


        input::placeholder {

            color: #444;

        }


        .password-input {

            padding-right: 70px;

        }


        .toggle-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: 0;

            background: transparent;

            color: #555;

            font-family: monospace;

            font-size: 8px;

            letter-spacing: 0.1em;

            text-transform: uppercase;

            cursor: pointer;

        }


        .toggle-password:hover {

            color: #aaa;

        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {

            width: 100%;

            height: 52px;

            margin-top: 5px;

            border: 0;

            border-radius: 100px;

            background: #ff6b45;

            color: #080808;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 0.15em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                    transform 0.2s ease,
                    background 0.2s ease;

        }


        .login-button {

            position: relative;

            overflow: hidden;

            transition:
                    transform 0.25s ease,
                    background 0.25s ease,
                    box-shadow 0.25s ease;

        }


        .login-button::before {

            content: "";

            position: absolute;

            top: 0;

            left: -100%;

            width: 100%;

            height: 100%;

            background:
                    linear-gradient(
                            90deg,
                            transparent,
                            rgba(255,255,255,0.18),
                            transparent
                    );

            transition:
                    left 0.5s ease;

        }


        .login-button:hover {

            background: #ff815f;

            transform:
                    translateY(-3px);

            box-shadow:
                    0 12px 30px
                    rgba(255, 107, 69, 0.18);

        }


        .login-button:hover::before {

            left: 100%;

        }


        .login-button:active {

            transform:
                    translateY(0);

            box-shadow: none;

        }


        .login-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;

        }


        /* =========================
           REGISTER
        ========================= */

        .register {

            margin-top: 30px;

            padding-top: 25px;

            border-top: 1px solid #242424;

            text-align: center;

            color: #555;

            font-size: 11px;

        }


        .register a {

            color: #aaa;

            text-decoration: none;

            margin-left: 5px;

        }


        .register a {

            position: relative;

            color: #aaa;

            text-decoration: none;

            margin-left: 5px;

            transition:
                    color 0.2s ease;

        }


        .register a::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: -4px;

            width: 0;

            height: 1px;

            background: #ff6b45;

            transition:
                    width 0.25s ease;

        }


        .register a:hover {

            color: #ff6b45;

        }


        .register a:hover::after {

            width: 100%;

        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            margin-top: 25px;

            text-align: center;

            color: #3d3d3d;

            font-family: monospace;

            font-size: 7px;

            letter-spacing: 0.15em;

            text-transform: uppercase;

        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 500px) {

            body {

                padding: 20px;

                overflow: auto;

            }


            .brand {

                margin-bottom: 30px;

            }


            .card {

                padding: 30px 25px;

            }


            h1 {

                font-size: 42px;

            }

        }

    </style>

</head>


<body>


<div class="background">

    <div class="grid"></div>

    <div class="glow"></div>

</div>


<div class="container">


    <!-- BRAND -->

    <div class="brand">

        <div class="brand-name">
            Future Capsule
        </div>

        <div class="brand-tagline">
            Messages beyond time
        </div>

    </div>


    <!-- CARD -->

    <div class="card">


        <div class="eyebrow">
            Welcome back
        </div>


        <h1>
            Enter your <em>future.</em>
        </h1>


        <p class="intro">

            Sign in to continue writing messages
            for the person you're becoming.

        </p>


        <!-- MESSAGE -->

        <div
                class="message"
                id="message">
        </div>


        <!-- FORM -->

        <form
                action="login"
                method="post"
                id="loginForm">


            <!-- EMAIL -->

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    Password
                </label>


                <div class="input-wrapper">

                    <input
                            type="password"
                            id="password"
                            name="password"
                            class="password-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                    >


                    <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword">
                        Show
                    </button>

                </div>

            </div>


            <!-- BUTTON -->

            <button
                    type="submit"
                    class="login-button"
                    id="loginButton">

                Enter Capsule

            </button>


        </form>


        <!-- REGISTER -->

        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </div>


    </div>


    <div class="footer">
        Your memories. Your time. Your story.
    </div>


</div>


<script>

    /*
     * Read URL parameters
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const message =
        document.getElementById(
            "message"
        );


    /*
     * Login error
     */

    if (
        params.get("error") ===
        "invalid"
    ) {

        message.textContent =
            "We couldn't find an account with those credentials. Please check your email and password.";

        message.classList.add(
            "show"
        );

    }


    /*
     * Registration success
     */

    if (
        params.get("registered") ===
        "true"
    ) {

        message.textContent =
            "Account created successfully. You can now sign in.";

        message.classList.add(
            "show",
            "success"
        );

    }


    /*
     * Password visibility
     */

    const password =
        document.getElementById(
            "password"
        );


    const togglePassword =
        document.getElementById(
            "togglePassword"
        );


    togglePassword.addEventListener(
        "click",
        function () {

            if (
                password.type ===
                "password"
            ) {

                password.type =
                    "text";

                togglePassword.textContent =
                    "Hide";

            } else {

                password.type =
                    "password";

                togglePassword.textContent =
                    "Show";

            }

        }
    );


    /*
     * Loading state
     */

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    loginForm.addEventListener(
        "submit",
        function () {

            /*
             * Only change the appearance while
             * the request is being processed.
             */

            loginButton.disabled = true;

            loginButton.textContent =
                "AUTHENTICATING...";

        }
    );


    /*
     * If the browser restores the page from
     * history/back-forward cache, make sure
     * the button becomes usable again.
     */

    window.addEventListener(
        "pageshow",
        function () {

            loginButton.disabled = false;

            loginButton.textContent =
                "ENTER CAPSULE";

        }
    );

</script>


</body>

</html>
